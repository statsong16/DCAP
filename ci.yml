name: CI

# 합성 데이터로 파이프라인이 끝까지 도는지 매 푸시마다 확인합니다.
# 성능을 검사하지 않습니다 — "돌아간다"만 검사합니다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run 01-microbiome-tokenization on synthetic data
        working-directory: experiments/01-microbiome-tokenization
        env:
          PYTHONPATH: src
        run: |
          python src/make_synthetic.py --out data --n-per-study 40
          python src/pretrain_masked.py --data data --out runs/masked --epochs 2
          python src/pretrain_masked.py --data data --out runs/masked_phylo --epochs 2 --use-phylo
          python src/crossmodal.py --data data --out runs/crossmodal --epochs 2
          python src/downstream.py --data data \
            --encoder runs/masked/encoder.pt \
            --embeddings runs/crossmodal/embeddings.npz \
            --label study_condition --positive case

      - name: Assert no data files are tracked
        run: |
          if git ls-files | grep -E '(^|/)data/' ; then
            echo "::error::data/ 아래 파일이 추적되고 있습니다."
            exit 1
          fi
